name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=./src/prisma/schema.prisma

      - name: Run database migrations
        run: npx prisma migrate deploy --schema=./src/prisma/schema.prisma

      - name: Lint
        run: npx nx lint api
        continue-on-error: true

      - name: Unit tests
        run: npx nx test api --testPathIgnorePatterns=auth.service.test.ts

  build:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npx nx build api

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  update-manifest:
    needs: build
    runs-on: ubuntu-latest
    # Only on merges to the default branch, never on PRs.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Use a token that can push back to the repo.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin manifest to the image just built
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          # Replace whatever tag is currently referenced with this commit's SHA.
          sed -i -E "s|image: ghcr.io/[^:]+:.*|image: ${IMAGE}|g" k8s/api.yaml
          echo "Pinned to ${IMAGE}"
          grep -n "image:" k8s/api.yaml

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet k8s/api.yaml; then
            echo "Manifest already current, nothing to commit."
            exit 0
          fi

          git add k8s/api.yaml
          # [skip ci] prevents this commit from re-triggering the workflow.
          git commit -m "Deploy ${GITHUB_SHA::7} [skip ci]"
          git push