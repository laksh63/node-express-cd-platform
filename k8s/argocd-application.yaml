apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: conduit
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/laksh63/node-express-cd-platform
    targetRevision: master
    path: k8s
    directory:
      exclude: 'argocd-application.yaml'

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
